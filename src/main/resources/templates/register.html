<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${storeName} + ' · ' + #{account.register}">注册</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <meta name="theme-color" content="#7fc5ac"/>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container section">
    <div class="form-wrap" style="max-width:440px;">
        <h2 class="section-title" th:text="#{account.register}">注册</h2>
        <p class="sub" th:text="#{account.registerDesc}">注册后可保存收货信息、随时查看订单进度</p>

        <div class="alert-error" th:if="${error == 'badEmail'}" th:text="#{account.badEmail}">邮箱格式不正确</div>
        <div class="alert-error" th:if="${error == 'weakPassword'}" th:text="#{account.weakPassword}">密码至少 8 位</div>
        <div class="alert-error" th:if="${error == 'dupEmail'}" th:text="#{account.dupEmail}">该邮箱已注册，请直接登录</div>

        <form method="post" th:action="@{/register}">
            <input type="hidden" name="redirect" th:value="${redirectTo}"/>
            <div class="field">
                <label th:text="#{checkout.email}">邮箱</label>
                <input type="email" name="email" required th:value="${email}" autocomplete="email"/>
            </div>
            <div class="field">
                <label th:text="#{account.nickname}">称呼</label>
                <input type="text" name="name" th:value="${name}" autocomplete="name"/>
            </div>
            <div class="field">
                <label th:text="#{admin.password}">密码</label>
                <input type="password" name="password" required minlength="8" autocomplete="new-password"/>
                <p class="hint" th:text="#{account.passwordHint}">至少 8 位</p>
            </div>
            <button class="btn btn-block" type="submit" th:text="#{account.register}">注册</button>
        </form>

        <p class="muted small" style="text-align:center;margin-top:16px;">
            <span th:text="#{account.hasAccount}">已有账号？</span>
            <a th:href="@{/login(redirect=${redirectTo})}" th:text="#{account.login}">登录</a>
        </p>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
