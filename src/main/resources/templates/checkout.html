<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${storeName} + ' · ' + #{checkout.title}">结算</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="manifest" th:href="@{/manifest.webmanifest}"/>
    <link rel="apple-touch-icon" th:href="@{/icon.svg}"/>
    <meta name="theme-color" content="#7fc5ac"/>
    <meta name="_csrf" th:content="${csrf}"/>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: mobilenav}"></div>

<div class="container section">
    <h2 class="section-title" th:text="#{checkout.title}">结算</h2>

    <div class="checkout-grid">
        <!-- 订单摘要 -->
        <div class="checkout-summary">
            <h4 th:text="#{cart.title}">购物车</h4>
            <div class="sum-line" th:each="line : ${lines}">
                <span th:text="${#locale.language == 'en' ? line.product.nameEn : line.product.name} + ' ×' + ${line.quantity}">商品</span>
                <span class="price" th:text="${currencySymbol} + ${#numbers.formatDecimal(line.lineTotal.multiply(fxRate),1,2)}">$0.00</span>
            </div>
            <div class="sum-total price" th:text="#{cart.total} + '：' + ${currencySymbol} + ${#numbers.formatDecimal(total.multiply(fxRate),1,2)}">合计</div>
        </div>

        <!-- 收货与下单 -->
        <form class="checkout-form" action="/cart/place" method="post">
            <div class="login-tip" th:if="${user == null}">
                <span th:text="#{account.loginTip}">注册/登录后，收货信息会自动带出</span>
                <a th:href="@{/login(redirect='/cart/checkout')}" th:text="#{account.login}">登录</a>
            </div>

            <label><span th:text="#{checkout.name}">收货人</span> <span class="req">*</span></label>
            <input type="text" name="customerName" required autocomplete="name"
                   th:value="${user != null} ? ${user.name} : ''"/>

            <label><span th:text="#{checkout.email}">邮箱</span> <span class="req">*</span></label>
            <input type="email" name="email" required autocomplete="email"
                   th:value="${user != null} ? ${user.email} : ''"/>
            <p class="hint" th:text="#{checkout.emailHint}">订单进度会通过这个邮箱通知你</p>

            <label th:text="#{checkout.phone}">电话</label>
            <input type="tel" name="phone" autocomplete="tel" th:value="${user != null} ? ${user.phone} : ''"/>
            <p class="hint" th:text="#{checkout.phoneHint}">选填，便于物流联系</p>

            <label><span th:text="#{checkout.country}">国家/地区</span> <span class="req">*</span></label>
            <select name="country" required>
                <option value="" th:text="#{checkout.countryHint}">请选择</option>
                <option th:each="c : ${#strings.arraySplit('United States,Canada,United Kingdom,Germany,France,Italy,Spain,Australia,Japan,South Korea,Singapore,中国大陆,中国香港,中国台湾,Other', ',')}"
                        th:value="${c}" th:text="${c}"
                        th:selected="${user != null and user.country != null and c == user.country}">US</option>
            </select>

            <label><span th:text="#{checkout.address}">收货地址</span> <span class="req">*</span></label>
            <textarea name="address" rows="2" required autocomplete="street-address"
                      th:text="${user != null} ? ${user.address} : ''"></textarea>

            <label th:text="#{checkout.note}">留言</label>
            <textarea name="note" rows="2" th:placeholder="#{checkout.noteHint}"></textarea>

            <label th:text="#{checkout.currency}">结算币种</label>
            <select name="currency">
                <option th:each="c : ${currencies}" th:value="${c.code}"
                        th:text="${c.code + ' ' + c.symbol}"
                        th:selected="${c.code == currencyCode}">USD</option>
            </select>

            <button class="btn btn-block" type="submit" th:text="#{checkout.place}">提交订单</button>
            <a class="muted small" style="text-align:center;margin-top:6px;"
               th:href="@{/cart}" th:text="#{checkout.back}">返回购物车</a>
        </form>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
