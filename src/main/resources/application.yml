server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: shine-xumis
  thymeleaf:
    cache: false          # 开发期关闭缓存，生产可改为 true
    encoding: UTF-8
    mode: HTML
  messages:
    encoding: UTF-8
    basename: messages
  jackson:
    default-property-inclusion: non_null
  # 开发期使用 H2 文件库（数据落在本目录 ./data 下，重启不丢失，符合"目录内安装"）
  datasource:
    url: jdbc:h2:file:./data/shinedb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  # 文件上传限制
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

app:
  upload-dir: ./uploads
  upload-url: /files/
  admin-key: admin        # 演示用后台密钥，生产务必修改并接入正式鉴权
  mobile-api-key: ""       # 手机端 /api/m/** 访问密钥；留空=开发期免校验，生产务必设置
  # 多币种展示（基准币种为 USD，price 字段以 USD 存储；展示价 = price × rate）
  currencies:
    - code: USD
      symbol: "$"
      rate: 1.0
      enabled: true
      default-currency: true
    - code: CNY
      symbol: "¥"
      rate: 7.2
      enabled: true
      default-currency: false
    - code: EUR
      symbol: "€"
      rate: 0.92
      enabled: true
      default-currency: false
  erp:
    enabled: false        # 总开关：true 时业务数据才会同步到 ERP
    type: noop            # noop(仅日志) | http(调用外部接口)
    base-url: ""          # ERP 接口基地址，如 https://erp.example.com/api
    api-key: ""
    timeout-ms: 5000

---
# 生产环境：执行 mvn -Dspring.profiles.active=prod 或设置环境变量 SPRING_PROFILES_ACTIVE=prod
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shine}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  upload-url: /files/
  admin-key: ${ADMIN_KEY:change-me}
  mobile-api-key: ${MOBILE_API_KEY:}
  currencies:
    - code: USD
      symbol: "$"
      rate: 1.0
      enabled: true
      default-currency: true
    - code: CNY
      symbol: "¥"
      rate: 7.2
      enabled: true
      default-currency: false
    - code: EUR
      symbol: "€"
      rate: 0.92
      enabled: true
      default-currency: false
  erp:
    enabled: ${ERP_ENABLED:false}
    type: ${ERP_TYPE:noop}
    base-url: ${ERP_BASE_URL:}
    api-key: ${ERP_API_KEY:}
    timeout-ms: ${ERP_TIMEOUT_MS:5000}
