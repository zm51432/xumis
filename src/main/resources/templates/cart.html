<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${storeName} + ' · ' + #{cart.title}">购物车</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="manifest" th:href="@{/manifest.webmanifest}"/>
    <link rel="apple-touch-icon" th:href="@{/icon.svg}"/>
    <meta name="theme-color" content="#7fc5ac"/>
    <meta name="_csrf" th:content="${csrf}"/>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: mobilenav}"></div>

<div class="container section">
    <h2 class="section-title" th:text="#{cart.title}">购物车</h2>

    <!-- 顶部醒目提示条 -->
    <div class="cart-notice" th:if="${not isEmpty}">
        <span class="cn-icon">🛒</span>
        <span th:text="#{cart.countTip}">购物车共</span>
        <b th:text="${cartCount}">0</b>
        <span th:text="#{cart.countUnit}">件商品</span>
    </div>
    <div class="cart-notice warn" th:if="${param.invalid != null}">
        <span class="cn-icon">⚠️</span>
        <span th:text="#{cart.invalid}">部分商品已下架或缺货，已从购物车移除</span>
    </div>

    <div th:if="${isEmpty}" class="empty-cart">
        <div class="empty-icon">🛒</div>
        <p class="strong" th:text="#{cart.empty}">购物车还是空的</p>
        <p class="muted" th:text="#{cart.emptyHint}">去挑选喜欢的饰品与手工品吧～</p>
        <a class="btn" th:href="@{/products}" th:text="#{cart.continue}">继续购物</a>
    </div>

    <div th:if="${not isEmpty}">
        <table class="cart-table">
            <thead>
                <tr>
                    <th th:text="#{nav.products}">商品</th>
                    <th th:text="#{cart.quantity}">数量</th>
                    <th th:text="#{cart.lineTotal}">小计</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="line : ${lines}">
                    <td class="cart-prod">
                        <img th:src="${line.product.imageUrl}" alt=""/>
                        <span th:text="${#locale.language == 'en' ? line.product.nameEn : line.product.name}">商品</span>
                    </td>
                    <td>
                        <form action="/cart/update" method="post" class="inline-form">
                            <input type="hidden" name="productId" th:value="${line.product.id}"/>
                            <input class="qty-input" type="number" name="quantity" min="1"
                                   th:value="${line.quantity}" th:attr="max=${line.product.stock}"/>
                            <button class="btn btn-ghost btn-sm" type="submit">✓</button>
                        </form>
                    </td>
                    <td class="price" th:text="${currencySymbol} + ${#numbers.formatDecimal(line.lineTotal.multiply(fxRate),1,2)}">$0.00</td>
                    <td>
                        <form action="/cart/remove" method="post" class="inline-form">
                            <input type="hidden" name="productId" th:value="${line.product.id}"/>
                            <button class="btn btn-ghost btn-sm" type="submit" th:text="#{cart.remove}">移除</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="cart-foot">
            <div class="price total" th:text="#{cart.total} + '：' + ${currencySymbol} + ${#numbers.formatDecimal(total.multiply(fxRate),1,2)}">合计</div>
            <a class="btn" th:href="@{/cart/checkout}" th:text="#{cart.checkout}">去结算</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
