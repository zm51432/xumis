<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${storeName} + ' · ' + #{nav.admin}">后台</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container section" th:if="${denied}">
    <div class="denied">
        <h2>🔒 Admin Access</h2>
        <p>请通过 <code>/admin?key=YOUR_KEY</code> 访问（演示密钥见 application.yml 的 app.admin-key）。</p>
        <p class="hint">⚠️ 生产环境务必接入正式鉴权（Spring Security / OAuth），勿暴露此入口。</p>
    </div>
</div>

<div class="container section" th:if="${!denied}">
    <h2 th:text="#{nav.admin}">后台</h2>
    <p class="sub">客户自定义想法 & 询盘</p>

    <h3>📥 客户自定义想法</h3>
    <table>
        <thead>
        <tr><th>ID</th><th>称呼</th><th>邮箱</th><th>国家</th><th>分类</th><th>想法</th><th>参考图</th><th>状态</th><th>时间</th></tr>
        </thead>
        <tbody>
        <tr th:each="i : ${ideas}">
            <td th:text="${i.id}"></td>
            <td th:text="${i.customerName}"></td>
            <td th:text="${i.email}"></td>
            <td th:text="${i.country}"></td>
            <td th:text="${i.expectCategory != null ? i.expectCategory.label : '-'}"></td>
            <td th:text="${#strings.abbreviate(i.ideaDescription, 40)}"></td>
            <td><a th:if="${i.referenceImageUrl != null}" th:href="${i.referenceImageUrl}" target="_blank">查看</a></td>
            <td th:text="${i.status}"></td>
            <td th:text="${i.createdAt}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(ideas)}"><td colspan="9">暂无数据</td></tr>
        </tbody>
    </table>

    <h3 style="margin-top:36px;">✉️ 询盘留言</h3>
    <table>
        <thead>
        <tr><th>ID</th><th>姓名</th><th>邮箱</th><th>主题</th><th>留言</th><th>状态</th><th>时间</th></tr>
        </thead>
        <tbody>
        <tr th:each="m : ${inquiries}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.name}"></td>
            <td th:text="${m.email}"></td>
            <td th:text="${m.subject}"></td>
            <td th:text="${#strings.abbreviate(m.message, 40)}"></td>
            <td th:text="${m.status}"></td>
            <td th:text="${m.createdAt}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(inquiries)}"><td colspan="7">暂无数据</td></tr>
        </tbody>
    </table>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
