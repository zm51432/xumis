<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${storeName} + ' · ' + #{account.login}">登录</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <meta name="theme-color" content="#7fc5ac"/>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container section">
    <div class="form-wrap" style="max-width:420px;">
        <h2 class="section-title" th:text="#{account.login}">登录</h2>
        <p class="sub" th:text="#{account.loginDesc}">登录后下单无需重复填写收货信息</p>

        <div class="alert-error" th:if="${error}" th:text="#{account.loginError}">邮箱或密码不正确</div>
        <div class="alert-success" th:if="${param.registered != null}" th:text="#{account.registered}">注册成功</div>

        <form method="post" th:action="@{/login}">
            <input type="hidden" name="redirect" th:value="${redirectTo}"/>
            <div class="field">
                <label th:text="#{checkout.email}">邮箱</label>
                <input type="email" name="email" required th:value="${email}" autocomplete="email" autofocus/>
            </div>
            <div class="field">
                <label th:text="#{admin.password}">密码</label>
                <input type="password" name="password" required autocomplete="current-password"/>
            </div>
            <button class="btn btn-block" type="submit" th:text="#{account.login}">登录</button>
        </form>

        <p class="muted small" style="text-align:center;margin-top:16px;">
            <span th:text="#{account.noAccount}">还没有账号？</span>
            <a th:href="@{/register(redirect=${redirectTo})}" th:text="#{account.register}">注册</a>
            <span style="margin:0 8px;">·</span>
            <a th:href="@{/order/track}" th:text="#{nav.track}">订单查询</a>
        </p>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
