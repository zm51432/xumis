<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="color-scheme" content="light"/>
    <meta name="format-detection" content="telephone=no"/>
    <title th:text="${storeName} + ' · ' + #{account.authTitle}">登录 / 注册</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20261105g')}"/>
    <style>
        .code-row { display:flex; gap:8px; align-items:stretch; }
        .code-row input { flex:1; min-width:0; }
        .btn-code { white-space:nowrap; padding:0 14px; border:none; border-radius:8px;
                    background:#7fc5ac; color:#fff; font-size:14px; cursor:pointer; }
        .btn-code:disabled { opacity:.6; cursor:default; }
        #code-hint { margin-top:6px; }
    </style>
    <meta name="theme-color" content="#7fc5ac"/>
    <meta name="_csrf" th:content="${csrf}"/>
    <th:block th:replace="~{fragments :: headseo}"></th:block>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container section">
    <div class="form-wrap auth-wrap">
        <h2 class="section-title" th:text="#{account.authTitle}">登录 / 注册</h2>
        <p class="sub" th:text="#{account.authDesc}">一个账号即可保存收货信息、随时查看订单进度</p>

        <!-- 登录 / 注册 合并页：默认只显示登录，注册通过下方链接展开 -->

        <!-- 登录面板 -->
        <div class="auth-panel" id="panel-login"
             th:classappend="${tab == 'register'} ? 'is-hidden' : ''">
            <div class="alert-error" th:if="${loginError}" th:text="#{account.loginError}">邮箱或密码不正确</div>
            <div class="alert-error" th:if="${lockedSeconds != null}"
                 th:text="${lockedSeconds} + ' ' + #{account.locked}">尝试过于频繁，请稍后再试</div>
            <div class="alert-success" th:if="${param.registered != null}" th:text="#{account.registered}">注册成功</div>

            <form method="post" th:action="@{/login}">
                <input type="hidden" name="redirect" th:value="${redirectTo}"/>
                <div class="field">
                    <label th:text="#{checkout.email}">邮箱</label>
                    <input type="email" name="email" required th:value="${email}" autocomplete="email"
                           th:autofocus="${tab != 'register'}"/>
                </div>
                <div class="field">
                    <label th:text="#{admin.password}">密码</label>
                    <input type="password" name="password" required autocomplete="current-password"/>
                </div>
                <button class="btn btn-block" type="submit" th:text="#{account.login}">登录</button>
            </form>

            <p class="muted small auth-foot">
                <a th:href="@{/forgot-password}" th:text="#{account.forgotPwd}">忘记密码</a>
                <span style="margin:0 8px;">·</span>
                <a th:href="@{/order/track}" th:text="#{nav.track}">订单查询</a>
            </p>
            <p class="muted small auth-foot" style="margin-top:10px;">
                <a href="#" id="to-register" th:text="#{account.noAccountCta}">还没有账号？注册</a>
            </p>
        </div>

        <!-- 注册面板 -->
        <div class="auth-panel" id="panel-register"
             th:classappend="${tab == 'register'} ? '' : 'is-hidden'">
            <div class="alert-error" th:if="${regError == 'badEmail'}" th:text="#{account.badEmail}">邮箱格式不正确</div>
            <div class="alert-error" th:if="${regError == 'weakPassword'}" th:text="#{account.weakPassword}">密码至少 8 位</div>
            <div class="alert-error" th:if="${regError == 'pwdMismatch'}" th:text="#{account.pwdMismatch}">两次输入的密码不一致</div>
            <div class="alert-error" th:if="${regError == 'dupEmail'}" th:text="#{account.dupEmail}">该邮箱已注册，请直接登录</div>
            <div class="alert-error" th:if="${regError == 'badCode'}" th:text="#{account.badCode}">验证码不正确或已过期</div>

            <form method="post" th:action="@{/register}" onsubmit="return checkRegisterForm(this)">
                <input type="hidden" name="redirect" th:value="${redirectTo}"/>
                <div class="field">
                    <label th:text="#{checkout.email}">邮箱</label>
                    <div class="code-row">
                        <input type="email" id="reg-email" name="email" required th:value="${email}" autocomplete="email"
                               th:autofocus="${tab == 'register'}"/>
                        <button type="button" class="btn-code" id="send-code"
                                th:text="#{account.sendCode}"
                                th:data-sent="#{account.codeSent}"
                                th:data-ratelimited="#{account.codeRateLimited}"
                                th:data-bademail="#{account.badEmail}"
                                th:data-sending="#{account.codeSending}"
                                th:data-neterr="#{account.codeNetErr}"
                                th:data-again="#{account.sendCodeAgain}">发送验证码</button>
                    </div>
                    <p class="hint" id="code-hint" th:text="#{account.codeHint}">为保障账号安全，注册需验证邮箱</p>
                </div>
                <div class="field">
                    <label th:text="#{account.code}">邮箱验证码</label>
                    <input type="text" name="code" required inputmode="numeric" maxlength="6" autocomplete="one-time-code"
                           th:placeholder="#{account.codePlaceholder}"/>
                </div>
                <div class="field">
                    <label th:text="#{account.nickname}">称呼</label>
                    <input type="text" name="name" th:value="${name}" autocomplete="name"/>
                </div>
                <div class="field">
                    <label th:text="#{admin.password}">密码</label>
                    <input type="password" name="password" required minlength="8" autocomplete="new-password"/>
                    <p class="hint" th:text="#{account.passwordHint}">至少 8 位</p>
                </div>
                <div class="field">
                    <label th:text="#{account.confirmPassword}">确认密码</label>
                    <input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"/>
                </div>
                <p class="alert-error" id="pwdMismatch" style="display:none;"
                   th:text="#{account.pwdMismatch}">两次输入的密码不一致</p>
                <button class="btn btn-block" type="submit" th:text="#{account.register}">注册</button>
            </form>

            <p class="muted small auth-foot" th:text="#{account.termsNote}">注册即表示同意本站服务条款与隐私政策</p>
            <p class="muted small auth-foot" style="margin-top:10px;">
                <a href="#" id="to-login" th:text="#{account.toLogin}">已有账号？登录</a>
            </p>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
<script>
    (function () {
        var loginPanel = document.getElementById('panel-login');
        var regPanel = document.getElementById('panel-register');
        function show(which) {
            if (!loginPanel || !regPanel) return;
            var reg = (which === 'register');
            regPanel.classList.toggle('is-hidden', !reg);
            loginPanel.classList.toggle('is-hidden', reg);
            var panel = reg ? regPanel : loginPanel;
            var f = panel.querySelector('input:not([type=hidden])');
            if (f) f.focus();
        }
        var toReg = document.getElementById('to-register');
        var toLogin = document.getElementById('to-login');
        if (toReg) toReg.addEventListener('click', function (e) { e.preventDefault(); show('register'); });
        if (toLogin) toLogin.addEventListener('click', function (e) { e.preventDefault(); show('login'); });

        // 发送邮箱验证码
        var sendBtn = document.getElementById('send-code');
        var hint = document.getElementById('code-hint');
        if (sendBtn) {
            var msg = {
                sent: sendBtn.getAttribute('data-sent') || '验证码已发送，请查收邮箱（10 分钟内有效）',
                rate: sendBtn.getAttribute('data-ratelimited') || '发送过于频繁，请稍后再试',
                bad: sendBtn.getAttribute('data-bademail') || '请先填写正确的邮箱',
                sending: sendBtn.getAttribute('data-sending') || '发送中…',
                neterr: sendBtn.getAttribute('data-neterr') || '网络错误，请重试',
                again: sendBtn.getAttribute('data-again') || '重新发送'
            };
            sendBtn.addEventListener('click', function () {
                var email = (document.getElementById('reg-email') || {}).value || '';
                if (!email || email.indexOf('@') < 0) {
                    hint.style.color = '#c0392b';
                    hint.textContent = msg.bad;
                    return;
                }
                var prev = sendBtn.textContent;
                sendBtn.disabled = true;
                sendBtn.textContent = msg.sending;
                var csrf = (document.querySelector('meta[name="_csrf"]') || {}).content || '';
                fetch('/register/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRF-Token': csrf },
                    body: 'email=' + encodeURIComponent(email)
                }).then(function (r) { return r.json(); }).then(function (d) {
                    if (d && d.ok) {
                        hint.style.color = '';
                        hint.textContent = msg.sent;
                        sendBtn.textContent = msg.again;
                        var left = 60, timer = setInterval(function () {
                            left--;
                            sendBtn.textContent = msg.again + '(' + left + 's)';
                            if (left <= 0) { clearInterval(timer); sendBtn.disabled = false; sendBtn.textContent = msg.again; }
                        }, 1000);
                    } else {
                        sendBtn.disabled = false;
                        sendBtn.textContent = prev;
                        hint.style.color = '#c0392b';
                        hint.textContent = (d && d.error === 'rateLimited') ? msg.rate : msg.bad;
                    }
                }).catch(function () {
                    sendBtn.disabled = false;
                    sendBtn.textContent = prev;
                    hint.style.color = '#c0392b';
                    hint.textContent = msg.neterr;
                });
            });
        }
    })();

    // 前端先拦一次密码不一致，减少无意义往返；服务端仍会二次校验
    function checkRegisterForm(f) {
        var p = f.password.value, c = f.confirmPassword.value;
        var box = document.getElementById('pwdMismatch');
        if (p !== c) {
            if (box) box.style.display = 'block';
            f.confirmPassword.focus();
            return false;
        }
        if (box) box.style.display = 'none';
        return true;
    }
</script>
</body>
</html>
