<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${storeName} + ' · ' + #{order.success}">下单成功</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="manifest" th:href="@{/manifest.webmanifest}"/>
    <link rel="apple-touch-icon" th:href="@{/icon.svg}"/>
    <meta name="theme-color" content="#7fc5ac"/>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: mobilenav}"></div>

<div class="container section success-box">
    <div class="success-icon">✅</div>
    <h2 th:text="#{order.success}">下单成功！</h2>
    <p th:text="#{order.successDesc}">感谢你的订单</p>
    <p class="order-no" th:if="${orderNo != null}">
        <span th:text="#{order.no}">订单号</span>：<strong th:text="${orderNo}">SH...</strong>
        <button class="btn btn-ghost btn-sm" type="button"
                th:attr="onclick='copyText(\'' + ${orderNo} + '\')'" th:text="#{track.copy}">复制</button>
    </p>

    <div class="next-steps">
        <p class="muted" th:text="#{order.nextSteps}">下一步：我们会通过邮件与你确认订单，发货后会更新订单状态。</p>
        <div class="btn-row">
            <a class="btn" th:href="@{/order/track(no=${orderNo})}" th:text="#{track.submit}">查询订单</a>
            <a class="btn btn-ghost" th:href="@{/products}" th:text="#{cart.continue}">继续购物</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
