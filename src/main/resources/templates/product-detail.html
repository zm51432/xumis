<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${storeName} + ' · ' + ${product.name}">商品详情</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="manifest" th:href="@{/manifest.webmanifest}"/>
    <link rel="apple-touch-icon" th:href="@{/icon.svg}"/>
    <meta name="theme-color" content="#7fc5ac"/>
    <link rel="canonical" th:href="${siteBaseUrl} + '/product/' + ${product.id}"/>
    <meta property="og:title" th:content="${product.name}"/>
    <meta property="og:type" content="product"/>
    <meta property="og:url" th:content="${siteBaseUrl} + '/product/' + ${product.id}"/>
    <meta property="og:image" th:content="${siteBaseUrl} + ${product.imageUrl}"/>
    <meta property="og:description" th:content="${product.description}"/>
    <meta name="_csrf" th:content="${csrf}"/>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: mobilenav}"></div>

<nav class="breadcrumb" aria-label="breadcrumb">
    <a th:href="@{/}" th:text="#{nav.home}">首页</a><span class="sep">/</span>
    <a th:href="@{/products}" th:text="#{nav.products}">商品</a><span class="sep">/</span>
    <a th:href="@{/products(cat=${product.category})}" th:text="${product.category.label}">分类</a><span class="sep">/</span>
    <span class="current" th:text="${#locale.language == 'en' ? product.nameEn : product.name}">商品名</span>
</nav>

<div class="container section">
    <div class="detail" th:if="${product != null}">
        <img class="detail-img" th:src="${product.imageUrl}" alt="product" loading="lazy"
             onerror="imgFallback(this)"/>
        <div>
            <h1 th:text="${#locale.language == 'en' ? product.nameEn : product.name}">商品名</h1>
            <div class="rating-row" th:if="${reviewCount > 0}">
                <span class="stars" th:text="${#numbers.formatDecimal(avgRating,1,1)} + ' ★'">5.0 ★</span>
                <span class="muted" th:text="${reviewCount} + ' ' + #{product.reviews}">0 评价</span>
            </div>
            <ul class="meta">
                <li><strong th:text="#{product.category}">分类</strong>：
                    <span th:text="${product.category.label}">饰品</span></li>
                <li><strong th:text="#{product.material}">材质</strong>：
                    <span th:text="${product.material}">—</span></li>
                <li th:if="${product.stock != null and product.stock > 0}"><strong th:text="#{product.stock}">库存</strong>：
                    <span th:if="${product.stock <= 10}" th:text="#{product.lowStock(${product.stock})}">仅剩 N 件</span>
                    <span th:if="${product.stock > 10}" th:text="#{product.inStock}">现货充足</span></li>
                <li th:if="${product.stock == null or product.stock <= 0}"><strong th:text="#{product.stock}">库存</strong>：
                    <span th:text="#{product.outOfStock}">暂时缺货</span></li>
                <li th:if="${product.customizable}">
                    <span class="tag custom" th:text="#{product.customizable}">支持来图定制</span></li>
            </ul>
            <p th:text="${#locale.language == 'en' ? product.descriptionEn : product.description}">描述</p>
            <div class="price" style="font-size:24px;margin:14px 0;"
                 th:text="${currencySymbol} + ${#numbers.formatDecimal(product.price.multiply(fxRate),1,2)}">$0.00</div>

            <!-- 加入购物车：无刷新加购（JS 可用时），无 JS 时仍可整页提交 -->
            <div class="buy-row">
                <div class="qty-stepper">
                    <button type="button" class="qty-btn" onclick="stepQty(-1)" aria-label="minus">−</button>
                    <input class="qty-input" id="qtyInput" type="number" value="1" min="1" th:attr="max=${product.stock}"/>
                    <button type="button" class="qty-btn" onclick="stepQty(1)" aria-label="plus">+</button>
                </div>
                <button class="btn btn-lg" type="button"
                        th:attr="data-out=${product.stock != null and product.stock <= 0}"
                        th:classappend="${product.stock != null and product.stock <= 0} ? 'btn-disabled' : ''"
                        th:text="${product.stock != null and product.stock <= 0} ? '暂时缺货' : #{cart.add}"
                        th:onclick="${product.stock != null and product.stock <= 0} ? '' : 'addToCart(' + ${product.id} + ', document.getElementById(\'qtyInput\').value)'">
                    加入购物车
                </button>
                <a class="btn btn-ghost btn-lg" th:href="@{/cart}" th:text="#{nav.cart}">购物车</a>
            </div>
            <noscript>
                <form class="buy-row" action="/cart/add" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}"/>
                    <input class="qty-input" type="number" name="quantity" value="1" min="1"/>
                    <button class="btn" type="submit" th:text="#{cart.add}">加入购物车</button>
                </form>
            </noscript>

            <!-- 到货通知：缺货时引导留邮箱，避免流失 -->
            <div class="restock" th:if="${product.stock == null or product.stock <= 0}">
                <p class="muted" th:text="#{product.restockHint}">此商品暂时缺货，留下邮箱，到货第一时间通知你。</p>
                <form action="#" th:action="@{/product/{id}/restock(id=${product.id})}" method="post" class="inline-form">
                    <input type="email" name="email" required th:placeholder="#{product.restockEmail}"/>
                    <input type="text" name="company" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true"/>
                    <button class="btn btn-sm" type="submit" th:text="#{product.restockBtn}">到货通知</button>
                </form>
                <p class="ok-msg" th:if="${param.restock != null}" th:text="#{product.restockOk}">已登记</p>
            </div>

            <div class="btn-row" style="justify-content:flex-start;margin-top:10px;">
                <a class="btn btn-ghost" th:if="${product.customizable}" th:href="@{/custom}" th:text="#{home.ctaCustom}">立即定制</a>
                <a class="btn btn-ghost" th:href="@{/inquiry}" th:text="#{home.ctaInquiry}">我要咨询</a>
            </div>
        </div>
    </div>
    <div th:if="${product == null}">
        <p>商品不存在。</p>
        <a class="btn" th:href="@{/products}" th:text="#{nav.products}">返回商品</a>
    </div>

    <!-- 相关推荐：同分类其它商品，降低跳出、带动连带购买 -->
    <div class="related reveal" th:if="${not #lists.isEmpty(related)}">
        <h3 th:text="#{product.related}">相关推荐</h3>
        <div class="grid">
            <div class="card" th:each="r : ${related}">
                <a th:href="@{/product/{id}(id=${r.id})}">
                    <img th:src="${r.imageUrl}" alt="" loading="lazy" onerror="imgFallback(this)"/>
                </a>
                <div class="card-body">
                    <h3 th:text="${#locale.language == 'en' ? r.nameEn : r.name}">商品</h3>
                    <span class="tag" th:text="${r.category.label}">分类</span>
                    <div class="price" th:text="${currencySymbol} + ${#numbers.formatDecimal(r.price.multiply(fxRate),1,2)}">$0.00</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 评价区 -->
    <div class="reviews reveal" th:if="${product != null}">
        <h3 th:text="#{product.reviews}">商品评价</h3>
        <div class="review-list" th:if="${not #lists.isEmpty(reviews)}">
            <div class="review-item" th:each="r : ${reviews}">
                <div class="stars" th:text="${r.rating} + ' ★'">5 ★</div>
                <p th:text="${r.comment}">好评</p>
                <small class="muted" th:text="${r.author}">匿名</small>
            </div>
        </div>
        <p class="muted" th:if="${#lists.isEmpty(reviews)}" th:text="#{review.empty}">暂无评价</p>

            <div class="alert-error" th:if="${param.reviewRate != null}" th:text="#{review.rateLimited}">评价提交过于频繁</div>
<div class="review-form">
            <h4 th:text="#{product.writeReview}">写评价</h4>
            <form action="#" th:action="@{/product/{id}/review(id=${product.id})}" method="post">
                <input type="text" name="author" th:placeholder="#{review.author}"/>
                <select name="rating">
                    <option value="5">5 ★</option>
                    <option value="4">4 ★</option>
                    <option value="3">3 ★</option>
                    <option value="2">2 ★</option>
                    <option value="1">1 ★</option>
                </select>
                <textarea name="comment" rows="3" required th:placeholder="#{review.comment}"></textarea>
                <button class="btn" type="submit" th:text="#{review.submit}">提交评价</button>
            </form>
            <p class="ok-msg" th:if="${param.review != null}" th:text="#{review.pending}">已提交</p>
        </div>
    </div>
</div>

<!-- SEO 结构化数据 -->
<script type="application/ld+json" th:if="${product != null}">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "[[${product.name}]]",
  "image": "[[${siteBaseUrl} + ${product.imageUrl}]]",
  "description": "[[${product.description}]]",
  "offers": {
    "@type": "Offer",
    "priceCurrency": "USD",
    "price": "[[${product.price}]]",
    "availability": "https://schema.org/InStock"
  }
}
</script>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
