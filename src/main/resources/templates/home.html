<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${storeName} + ' · ' + #{nav.home}">shine星心</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<!-- Hero -->
<section class="hero">
    <h1 th:text="#{home.hero}">让每一份心意，都被亲手点亮</h1>
    <p th:text="#{home.subtitle}">shine星心 · 饰品与手工品的温柔制造者</p>
    <div class="btn-row">
        <a class="btn" th:href="@{/custom}" th:text="#{home.ctaCustom}">立即定制</a>
        <a class="btn btn-ghost" th:href="@{/inquiry}" th:text="#{home.ctaInquiry}">我要咨询</a>
    </div>
</section>

<div class="container section">
    <h2 th:text="#{home.featured}">精选好物</h2>
    <p class="sub" th:text="${storeName} + ' / ' + ${storeNameEn}">shine星心</p>
    <div class="grid">
        <div class="card" th:each="p : ${featured}">
            <a th:href="@{/product/{id}(id=${p.id})}">
                <img th:src="${p.imageUrl}" alt="product"/>
            </a>
            <div class="card-body">
                <h3 th:text="${#locale.language == 'en' ? p.nameEn : p.name}">商品名</h3>
                <span class="tag" th:text="${p.category.label}">分类</span>
                <span class="tag custom" th:if="${p.customizable}" th:text="#{home.customizable}">支持来图定制</span>
                <div class="price" th:text="'$' + ${#numbers.formatDecimal(p.price,1,2)}">$0.00</div>
            </div>
        </div>
    </div>
</div>

<div class="container section" style="text-align:center;">
    <h2 th:text="#{home.customTitle}">把你的想法交给我们</h2>
    <p class="sub" th:text="#{home.customDesc}">上传参考图与描述，我们为你手工实现专属饰品与礼品。</p>
    <a class="btn" th:href="@{/custom}" th:text="#{home.ctaCustom}">立即定制</a>
</div>

<footer th:replace="~{fragments :: footer}"></footer>

<script th:src="@{/js/store.js}"></script>
</body>
</html>
