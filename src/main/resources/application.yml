server:
  port: 8080
  # 反代部署（Nginx/Caddy）时读取 X-Forwarded-*，使后端生成 https 绝对 OG/分享地址，
  # 否则社交分享拿到的是 http://127.0.0.1:8080/... 导致裂图。无反代时无该头，自动回退真实请求。
  forward-headers-strategy: native
  servlet:
    context-path: /
    session:
      cookie:
        http-only: true      # 会话 Cookie 禁止 JS 读取，降低 XSS 后的危害
        same-site: lax       # 跨站请求不带会话 Cookie，缓解 CSRF
      timeout: 7d
  error:
    whitelabel:
      enabled: false         # 出错时使用 templates/error/*.html，不暴露 Whitelabel 与堆栈
    include-stacktrace: never
    include-message: never   # 不在错误页回显内部异常信息

spring:
  application:
    name: shine-xumis
  thymeleaf:
    cache: false          # 生产可改为 true（或启用 prod profile）
    encoding: UTF-8
    mode: HTML
  messages:
    encoding: UTF-8
    basename: messages
  jackson:
    default-property-inclusion: non_null

  # ===== 数据库：MySQL（唯一数据源）=====
  # 可用环境变量覆盖：DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD
  # createDatabaseIfNotExist=true：库不存在时自动创建，省去手工建库
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:shine}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update    # 首次启动自动建表；生产建议改为 validate/none 并用 sql/init.sql 建表
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # 文件上传限制
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

app:
  upload-dir: ./uploads
  upload-url: /files/
  admin-key: admin        # 应急钥匙（仅在 app.admin-allow-key=true 时生效）
  admin-allow-key: false  # 默认关闭：后台必须走账号登录，避免"钥匙挂门上"
  admin-username: admin   # 首次启动自动创建的站长账号
  admin-password: Admin@12345   # 默认口令，登录后务必立即修改
  mobile-api-key: ""       # 手机端 /api/m/** 访问密钥；留空=开发期免校验，生产务必设置
  # 多币种展示（基准币种为 USD，price 字段以 USD 存储；展示价 = price × rate）
  currencies:
    - code: USD
      symbol: "$"
      rate: 1.0
      enabled: true
      default-currency: true
    - code: CNY
      symbol: "¥"
      rate: 7.2
      enabled: true
      default-currency: false
    - code: EUR
      symbol: "€"
      rate: 0.92
      enabled: true
      default-currency: false
  erp:
    enabled: false        # 总开关：true 时业务数据才会同步到 ERP
    type: noop            # noop(仅日志) | http(调用外部接口)
    base-url: ""          # ERP 接口基地址，如 https://erp.example.com/api
    api-key: ""
    timeout-ms: 5000

---
# 生产环境：java -jar ... --spring.profiles.active=prod
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  admin-key: ${ADMIN_KEY:change-me}
  admin-allow-key: ${ADMIN_ALLOW_KEY:false}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:change-me-please}
  mobile-api-key: ${MOBILE_API_KEY:}
  erp:
    enabled: ${ERP_ENABLED:false}
    type: ${ERP_TYPE:noop}
    base-url: ${ERP_BASE_URL:}
    api-key: ${ERP_API_KEY:}
    timeout-ms: ${ERP_TIMEOUT_MS:5000}

---
# 应急兜底：本机暂时没有 MySQL 时，可用内置文件库快速预览（仅用于开发/演示）
# 启用方式：java -jar target/shine-xumis.jar --spring.profiles.active=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/shinedb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
