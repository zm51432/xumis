<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="color-scheme" content="light"/>
    <meta name="format-detection" content="telephone=no"/>
    <title th:text="${storeName} + ' · ' + #{account.forgotPwd}">找回密码</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20261030c')}"/>
    <meta name="theme-color" content="#7fc5ac"/>
    <meta name="robots" content="noindex,nofollow"/>
    <meta name="_csrf" th:content="${csrf}"/>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container section">
    <div class="form-wrap" style="max-width:420px;">
        <h2 class="section-title" th:text="#{account.forgotPwd}">找回密码</h2>
        <p class="sub" th:text="#{account.forgotPwdDesc}">输入注册邮箱，我们会发送重置链接</p>

        <div class="alert-success" th:if="${param.sent != null}" th:text="#{account.resetSent}">
            如果该邮箱已注册，重置链接已发送，请查收邮件（1 小时内有效）。
        </div>

        <form method="post" th:action="@{/forgot-password}">
            <div class="field">
                <label th:text="#{checkout.email}">邮箱</label>
                <input type="email" name="email" required autocomplete="email" autofocus/>
            </div>
            <button class="btn btn-block" type="submit" th:text="#{account.sendReset}">发送重置链接</button>
        </form>

        <p class="muted small" style="text-align:center;margin-top:16px;">
            <a th:href="@{/login}" th:text="#{account.login}">返回登录</a>
        </p>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
