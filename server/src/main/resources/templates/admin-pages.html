<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title th:text="${storeName} + ' · 内容页'">内容页</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20261105g')}"/>
    <meta name="robots" content="noindex,nofollow"/>
    <meta name="_csrf" th:content="${csrf}"/>
    
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container section">
    <div class="admin-head">
        <div><h2 class="section-title">内容页</h2><p class="sub">关于我们 / 品牌故事 / 材质保养 / 尺寸指南 / 配送退换，正文支持 HTML</p></div>
        <div class="admin-head-actions">
            <span class="admin-me"><span class="strong" th:text="${me != null ? me.displayName : '-'}">管理员</span></span>
            <form method="post" th:action="@{|${adminBase}/logout|}" style="display:inline;">
                <button class="btn btn-ghost btn-sm" type="submit">退出登录</button>
            </form>
        </div>
    </div>
    <div th:replace="~{fragments :: adminnav}"></div>
    <div class="alert-success" th:if="${param.saved != null}">✅ 操作已完成</div>
    <div class="alert-error" th:if="${param.err != null}" th:text="${param.err}">出错了</div>

    <div class="panel admin-form">
        <h3 class="block-title" th:text="${edit != null} ? '编辑内容页' : '新增内容页'">编辑内容页</h3>
        <form method="post" th:action="@{|${adminBase}/pages/save|}">
            <div class="form-grid">
                <div class="field"><label for="pg-slug">URL 路径 *</label>
                    <input id="pg-slug" type="text" name="slug" required maxlength="60"
                           th:value="${edit != null} ? ${edit.slug} : ''" placeholder="about"/>
                    <p class="hint">前台地址 /p/路径，只能用小写字母、数字、-、_</p></div>
                <div class="field"><label for="pg-sort">排序</label>
                    <input id="pg-sort" type="number" name="sortOrder" th:value="${edit != null} ? ${edit.sortOrder} : '99'"/></div>
                <div class="field"><label for="pg-zh">标题（中文）</label>
                    <input id="pg-zh" type="text" name="titleZh" th:value="${edit != null} ? ${edit.titleZh} : ''"/></div>
                <div class="field"><label for="pg-en">标题（English）</label>
                    <input id="pg-en" type="text" name="titleEn" th:value="${edit != null} ? ${edit.titleEn} : ''"/></div>
                <div class="field col-span"><label for="pg-body-zh">正文（中文，支持 HTML）</label>
                    <textarea id="pg-body-zh" name="bodyZh" rows="8" th:text="${edit != null} ? ${edit.bodyZh} : ''"></textarea></div>
                <div class="field col-span"><label for="pg-body-en">正文（English，留空则显示中文）</label>
                    <textarea id="pg-body-en" name="bodyEn" rows="8" th:text="${edit != null} ? ${edit.bodyEn} : ''"></textarea></div>
                <div class="field switches"><label class="switch">
                    <input type="checkbox" name="published" value="on" th:checked="${edit == null or edit.published}"/>
                    <span>发布（取消勾选即下架，不删除）</span></label></div>
            </div>
            <div class="form-actions"><button class="btn" type="submit">保存页面</button>
                <a class="btn btn-ghost" th:href="@{|${adminBase}/pages|}">新建</a></div>
        </form>
    </div>
    <div class="panel" style="margin-top:16px;">
        <h3 class="block-title">全部内容页</h3>
        <div class="table-wrap"><table class="admin-table">
            <thead><tr><th>路径</th><th>中文标题</th><th>English</th><th>排序</th><th>状态</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="p : ${pages}">
                <td><a th:href="@{'/p/' + ${p.slug}}" target="_blank" th:text="${'/p/' + p.slug}">/p/about</a></td>
                <td th:text="${p.titleZh}">关于我们</td>
                <td th:text="${p.titleEn}">About Us</td>
                <td th:text="${p.sortOrder}">1</td>
                <td th:text="${p.published} ? '已发布' : '已下架'">已发布</td>
                <td>
                    <a class="btn btn-ghost btn-sm" th:href="@{|${adminBase}/pages?slug=${p.slug}|}">编辑</a>
                    <form method="post" th:action="@{|${adminBase}/pages/delete|}" class="inline-form">
                        <input type="hidden" name="slug" th:value="${p.slug}"/>
                        <button class="btn btn-ghost btn-sm" type="submit">下架</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table></div>
    </div>

</div>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
