<!DOCTYPE html>
<!--
  公开作品集页面（动态版）：通过 GET /api/data 读取后台数据并渲染。
  启动后台后访问 http://localhost:8080/ 即可看到由后台管理的内容。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的主页 | 个人作品集</title>
<style>
  :root { --bg:#0f1115; --fg:#e8eaed; --muted:#9aa0a6; --accent:#5b8cff; --accent2:#9b6bff; --card:#171a21; --border:#262b33; --shadow:0 8px 30px rgba(0,0,0,.35); }
  [data-theme="light"] { --bg:#ffffff; --fg:#1a1d21; --muted:#5f6368; --card:#f6f7f9; --border:#e3e6ea; --shadow:0 8px 30px rgba(0,0,0,.08); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); line-height:1.65; transition:background .3s,color .3s; }
  a { color:inherit; text-decoration:none; }
  nav { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:14px 24px; background:color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  nav .brand { font-weight:700; letter-spacing:.5px; }
  nav .links { display:flex; gap:18px; align-items:center; }
  nav .links a { color:var(--muted); font-size:14px; transition:color .2s; }
  nav .links a:hover { color:var(--accent); }
  .theme-btn { background:var(--card); border:1px solid var(--border); color:var(--fg); width:36px; height:36px; border-radius:50%; cursor:pointer; display:grid; place-items:center; }
  .theme-btn:hover { border-color:var(--accent); }
  .wrap { max-width:980px; margin:0 auto; padding:0 24px; }
  section { padding:72px 0; }
  .section-title { font-size:28px; font-weight:700; margin-bottom:6px; }
  .section-sub { color:var(--muted); margin-bottom:32px; }
  .hero { text-align:center; padding:96px 0 72px; }
  .avatar { width:110px; height:110px; border-radius:50%; margin:0 auto 22px; display:grid; place-items:center; font-size:40px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .hero h1 { font-size:40px; line-height:1.2; }
  .hero .grad { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p { color:var(--muted); margin:14px 0 28px; font-size:17px; }
  .btn { display:inline-block; padding:11px 22px; border-radius:10px; font-weight:600; font-size:15px; transition:transform .15s,opacity .2s; }
  .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
  .btn-ghost { border:1px solid var(--border); color:var(--fg); margin-left:12px; }
  .btn:hover { transform:translateY(-2px); opacity:.92; }
  .socials { margin-top:26px; display:flex; gap:16px; justify-content:center; }
  .socials a { color:var(--muted); transition:color .2s; }
  .socials a:hover { color:var(--accent); }
  .about-grid { display:grid; grid-template-columns:2fr 1fr; gap:32px; align-items:start; }
  .about-text { white-space:pre-line; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; text-align:center; }
  .stat .num { font-size:26px; font-weight:700; color:var(--accent); }
  .stat .label { color:var(--muted); font-size:13px; }
  .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px; }
  .chip { padding:6px 14px; border-radius:999px; font-size:13px; cursor:pointer; background:var(--card); border:1px solid var(--border); color:var(--muted); transition:all .2s; }
  .chip.active, .chip:hover { color:#fff; border-color:var(--accent); background:var(--accent); }
  .projects { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; transition:transform .2s,border-color .2s; }
  .card:hover { transform:translateY(-4px); border-color:var(--accent); }
  .card h3 { font-size:18px; margin-bottom:8px; }
  .card p { color:var(--muted); font-size:14px; min-height:42px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0; }
  .tag { font-size:12px; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); padding:3px 9px; border-radius:6px; }
  .card a.more { font-size:14px; font-weight:600; color:var(--accent); }
  .skills { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .skill { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .skill .name { display:flex; justify-content:space-between; font-size:14px; margin-bottom:8px; }
  .bar { height:8px; border-radius:999px; background:var(--border); overflow:hidden; }
  .bar > span { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .contact-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:36px; text-align:center; }
  .contact-card a { color:var(--accent); font-weight:600; }
  footer { text-align:center; color:var(--muted); padding:30px 0; border-top:1px solid var(--border); font-size:13px; }
  .notice { max-width:680px; margin:120px auto; padding:24px; background:var(--card); border:1px solid var(--border); border-radius:12px; color:var(--muted); line-height:1.8; }
  @media (max-width:720px) { .about-grid { grid-template-columns:1fr; } .hero h1 { font-size:30px; } nav .links a:not(.theme-btn) { display:none; } }
</style>
</head>
<body>
<nav>
  <div class="brand" id="brand">我的主页</div>
  <div class="links">
    <a href="#about">关于</a>
    <a href="#projects">作品</a>
    <a href="#skills">技能</a>
    <a href="#contact">联系</a>
    <button class="theme-btn" id="themeBtn" title="切换明暗主题">
      <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>

<header class="hero wrap" id="hero">
  <div class="avatar" id="avatar">XM</div>
  <h1>你好，我是 <span class="grad" id="heroName">你的名字</span></h1>
  <p id="heroSub">一句话介绍你自己</p>
  <div>
    <a class="btn btn-primary" href="#projects">查看作品</a>
    <a class="btn btn-ghost" href="#contact">联系我</a>
  </div>
  <div class="socials" id="socials">
    <a href="#" title="GitHub" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg></a>
    <a href="#" title="Email"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></a>
  </div>
</header>

<section id="about" class="wrap">
  <h2 class="section-title">关于我</h2>
  <p class="section-sub">这里写一段你的故事 / 经历 / 兴趣。</p>
  <div class="about-grid">
    <div class="about-text" id="aboutText"></div>
    <div class="stats" id="stats"></div>
  </div>
</section>

<section id="projects" class="wrap">
  <h2 class="section-title">作品集</h2>
  <p class="section-sub">点击标签可筛选；内容由后台管理。</p>
  <div class="filters" id="filters"></div>
  <div class="projects" id="projectList"></div>
</section>

<section id="skills" class="wrap">
  <h2 class="section-title">技能</h2>
  <p class="section-sub">由后台管理。</p>
  <div class="skills" id="skillList"></div>
</section>

<section id="contact" class="wrap">
  <div class="contact-card">
    <h2 class="section-title">一起聊聊？</h2>
    <p class="section-sub" style="margin-bottom:18px">有合作、项目或单纯想交流，欢迎联系我。</p>
    <p>邮箱：<a id="mailLink" href="#">you@example.com</a></p>
    <p style="margin-top:8px">GitHub：<a id="ghLink" href="#" target="_blank" rel="noopener">github.com/你的用户名</a></p>
  </div>
</section>

<footer>© <span id="year"></span> <span id="footName">你的名字</span> · 由 Java 后台驱动</footer>

<script>
  const API = '/api/data';
  let ALL = { site:{}, about:'', projects:[], skills:[] };
  let activeTag = '全部';

  // 主题切换
  const html = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const themeIcon = document.getElementById('themeIcon');
  const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  const saved = localStorage.getItem('theme');
  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(saved || (prefersLight ? 'light' : 'dark'));
  themeBtn.addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next); localStorage.setItem('theme', next);
  });
  function applyTheme(mode){ html.setAttribute('data-theme', mode); themeIcon.innerHTML = mode === 'light' ? MOON : SUN; }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  fetch(API).then(r => r.json()).then(render).catch(() => {
    document.body.innerHTML = '<div class="notice">无法加载数据。请先启动后台：<br>1) 安装 JDK 17+<br>2) 双击 <b>run.bat</b>（或运行 <code>java PortfolioServer</code>）<br>3) 浏览器打开 <b>http://localhost:8080/</b></div>';
  });

  function render(data){
    ALL = data || ALL;
    const s = ALL.site || {};
    document.title = s.title || '我的主页';
    document.getElementById('brand').textContent = s.name || '我的主页';
    document.getElementById('avatar').textContent = s.avatar || 'ME';
    document.getElementById('heroName').textContent = s.name || '你的名字';
    document.getElementById('heroSub').textContent = s.subtitle || '';
    document.getElementById('aboutText').textContent = ALL.about || '';
    document.getElementById('footName').textContent = s.name || '你的名字';
    document.getElementById('year').textContent = new Date().getFullYear();

    const gh = document.getElementById('ghLink');
    gh.href = s.github || '#';
    gh.textContent = (s.github || 'github.com').replace(/^https?:\/\//,'');
    const ml = document.getElementById('mailLink');
    ml.href = 'mailto:' + (s.email || '');
    ml.textContent = s.email || '';
    document.querySelectorAll('#socials a').forEach(a => {
      if (a.title === 'GitHub') a.href = s.github || '#';
      if (a.title === 'Email') a.href = 'mailto:' + (s.email || '');
    });

    const stats = [
      { num: (ALL.projects||[]).length, label: '作品' },
      { num: (ALL.skills||[]).length, label: '技能' },
      { num: '∞', label: '好奇心' }
    ];
    document.getElementById('stats').innerHTML = stats.map(x =>
      `<div class="stat"><div class="num">${esc(x.num)}</div><div class="label">${esc(x.label)}</div></div>`).join('');

    activeTag = '全部';
    renderFilters();
    renderProjects();
    document.getElementById('skillList').innerHTML = (ALL.skills||[]).map(sk =>
      `<div class="skill"><div class="name"><span>${esc(sk.name)}</span><span>${esc(sk.level)}%</span></div><div class="bar"><span style="width:${esc(sk.level)}%"></span></div></div>`).join('');
  }

  function renderFilters(){
    const tags = ['全部', ...[...new Set((ALL.projects||[]).flatMap(p => p.tags || []))]];
    document.getElementById('filters').innerHTML = tags.map(t =>
      `<span class="chip ${t===activeTag?'active':''}" data-tag="${esc(t)}">${esc(t)}</span>`).join('');
    document.querySelectorAll('#filters .chip').forEach(c =>
      c.addEventListener('click', () => { activeTag = c.dataset.tag; renderFilters(); renderProjects(); }));
  }

  function renderProjects(){
    const list = activeTag === '全部' ? (ALL.projects||[]) : (ALL.projects||[]).filter(p => (p.tags||[]).includes(activeTag));
    document.getElementById('projectList').innerHTML = list.map(p => `
      <div class="card">
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.desc)}</p>
        <div class="tags">${(p.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        <a class="more" href="${esc(p.link||'#')}" target="_blank" rel="noopener">查看详情 →</a>
      </div>`).join('');
  }
</script>
</body>
</html>
