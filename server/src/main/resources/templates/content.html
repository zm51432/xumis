<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="color-scheme" content="light"/>
    <title th:text="${storeName}">shine星心</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20261105g')}"/>
    <meta name="_csrf" th:content="${csrf}"/>
    <th:block th:replace="~{fragments :: headseo}"></th:block>
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: mobilenav}"></div>
<nav class="breadcrumb" aria-label="breadcrumb">
    <a th:href="@{|${langPrefix}/|}" th:text="#{nav.home}">首页</a><span class="sep">/</span>
    <span class="current" th:text="${#locale.language == 'en' ? pageTitleEn : pageTitle}">内容</span>
</nav>
<main class="container section" id="main-content">
    <div class="panel prose-wrap">
        <h1 class="section-title" th:text="${#locale.language == 'en' and !#strings.isEmpty(pageTitleEn) ? pageTitleEn : pageTitle}">关于我们</h1>
        <div class="prose" th:utext="${#locale.language == 'en' and !#strings.isEmpty(page.bodyEn) ? page.bodyEn : page.bodyZh}"></div>
        <p class="muted small" th:if="${page.updatedAt != null}"
           th:text="${'更新于 ' + #strings.substring(page.updatedAt.toString(),0,16)}"></p>
    </div>
    <div class="btn-row" style="margin-top:18px;">
        <a class="btn btn-ghost" th:href="@{|${langPrefix}/products|}" th:text="#{nav.products}">浏览商品</a>
        <a class="btn btn-ghost" th:href="@{|${langPrefix}/inquiry|}" th:text="#{nav.inquiry}">联系我们</a>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
