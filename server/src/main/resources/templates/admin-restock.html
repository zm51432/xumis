<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title th:text="${storeName} + ' · 到货通知'">到货通知</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20261105g')}"/>
    <meta name="robots" content="noindex,nofollow"/>
    <meta name="_csrf" th:content="${csrf}"/>
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>

<div class="container section">
    <div class="admin-head">
        <div>
            <h2 class="section-title">到货通知 Restock</h2>
            <p class="sub">缺货商品留邮箱的客户，补货后可批量通知</p>
        </div>
        <div class="admin-head-actions">
            <span class="admin-me"><span class="strong" th:text="${me != null ? me.displayName : '-'}">管理员</span></span>
            <form method="post" th:action="@{|${adminBase}/logout|}" style="display:inline;">
                <button class="btn btn-ghost btn-sm" type="submit">退出登录</button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments :: adminnav}"></div>
    <div class="alert-success" th:if="${param.saved != null}">✅ 已删除</div>

    <p class="result-count" th:text="${#lists.size(requests) + ' 条到货通知'}">0 条</p>

    <div class="table-wrap">
        <table class="admin-table">
            <thead><tr><th>#</th><th>商品 ID</th><th>邮箱</th><th>登记时间</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="r,it : ${requests}">
                <td th:text="${it.index + 1}">1</td>
                <td><a th:href="@{/product/{id}(id=${r.productId})}" target="_blank" th:text="${r.productId}">-</a></td>
                <td><a th:href="${'mailto:' + r.email}" th:text="${r.email}">-</a></td>
                <td><small th:text="${r.createdAt != null ? #strings.substring(r.createdAt.toString(),0,16) : '-'}">-</small></td>
                <td>
                    <form method="post" th:action="@{|${adminBase}/restock/delete|}" class="inline-form"
                          th:if="${me != null and me.canWrite()}">
                        <input type="hidden" name="id" th:value="${r.id}"/>
                        <button class="btn btn-ghost btn-sm" type="submit">删除</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(requests)}"><td colspan="5">暂无登记</td></tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
