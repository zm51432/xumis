# ============================================================================
# shine星心 独立站 (xumis) — Nginx 反向代理站点配置
# ----------------------------------------------------------------------------
# 用法：
#   1) 把本文件放到  /etc/nginx/sites-available/xumis
#   2) 软链：        ln -s /etc/nginx/sites-available/xumis /etc/nginx/sites-enabled/
#   3) 把 example.com / www.example.com 改成你的真实域名（A 记录已指向本机）
#   4) 申请证书：    sudo certbot --nginx -d example.com -d www.example.com
#      （certbot 会自动改写 ssl_certificate 路径并 reload；也可手动填下面两行）
#   5) 测试并重载：  sudo nginx -t && sudo systemctl reload nginx
#
# 前置条件：
#   - 后端 jar 监听 127.0.0.1:8080（见 deploy/README.md 的构建与 systemd）
#   - application.yml 已设置 server.forward-headers-strategy: native
#     （让后端读取 X-Forwarded-Proto，生成 https 绝对 OG 分享地址）
# ============================================================================

# ---- 80 端口：强制跳 HTTPS + 证书验证路径 ----
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # certbot 申请/续期时用的挑战路径（保留）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余一律 301 跳到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443 端口：HTTPS 主站 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # === TLS（certbot 自动写入；手动部署则改成你的证书路径）===
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # === 全局安全响应头 ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 按需收紧；当前允许同域 + 内联样式/脚本（Thymeleaf 内联）与 https 图片
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'self';" always;

    # === 静态资源：长缓存（后端已对 /img/products、/files 设缓存，这里兜底）===
    location ~* ^/(img|css|js|files|static)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # PWA manifest / 图标
    location = /manifest.webmanifest { proxy_pass http://127.0.0.1:8080; add_header Cache-Control "public, max-age=86400"; }
    location = /icon.svg            { proxy_pass http://127.0.0.1:8080; }

    # === H2 控制台：生产务必关闭或加 IP 白名单（默认注释掉）===
    # location /h2-console { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8080; }

    # === 动态请求：反代到 Spring Boot ===
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 关键：把真实访客信息透传给后端
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;     # https：后端据此生成绝对地址
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        client_max_body_size  12m;   # 与后端 spring.servlet.multipart.max-request-size 对齐
    }
}
