<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="color-scheme" content="light"/>
    <meta name="format-detection" content="telephone=no"/>
    <title th:text="${storeName} + ' · ' + #{nav.products}">商品</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20261105g')}"/>
    <link rel="manifest" th:href="@{/manifest.webmanifest}"/>
    <link rel="apple-touch-icon" th:href="@{/icon.svg}"/>
    <meta name="theme-color" content="#7fc5ac"/>
    <meta name="_csrf" th:content="${csrf}"/>
    <th:block th:replace="~{fragments :: headseo}"></th:block>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>
<div th:replace="~{fragments :: mobilenav}"></div>

<nav class="breadcrumb" aria-label="breadcrumb">
    <a th:href="@{/}" th:text="#{nav.home}">首页</a><span class="sep">/</span>
    <span class="current" th:text="#{nav.products}">商品</span>
</nav>

<div class="container section">
    <h2 class="section-title reveal" th:text="#{products.title}">全部商品</h2>
    <p class="sub" th:text="#{products.subtitle}">饰品 · 手工品 · 来图定制</p>

    <!-- 搜索 + 排序 -->
    <div class="toolbar">
        <form class="toolbar-search" th:action="@{|${langPrefix}/products|}" method="get">
            <input type="hidden" name="cat" th:value="${activeCatCode != null ? activeCatCode : activeCat}"/>
            <input type="hidden" name="sort" th:value="${sort}"/>
            <input type="text" name="q" th:value="${q}" th:placeholder="#{search.placeholder}"/>
            <input class="price-input" type="number" name="priceMin" step="0.01" min="0"
                   th:value="${pmin}" th:placeholder="#{products.priceMin}"/>
            <span class="pm-sep">–</span>
            <input class="price-input" type="number" name="priceMax" step="0.01" min="0"
                   th:value="${pmax}" th:placeholder="#{products.priceMax}"/>
            <button type="submit" th:text="#{search.button}">搜索</button>
        </form>
        <div class="toolbar-sort">
            <label th:text="#{sort.label}">排序</label>
            <select onchange="location.href=buildSortUrl(this.value)">
                <option value="sold_desc" th:selected="${sort=='sold_desc'}" th:text="#{sort.sold_desc}">按销量（推荐）</option>
                <option value="default" th:selected="${sort=='default'}" th:text="#{sort.default}">默认</option>
                <option value="price_asc" th:selected="${sort=='price_asc'}" th:text="#{sort.price_asc}">价格从低到高</option>
                <option value="price_desc" th:selected="${sort=='price_desc'}" th:text="#{sort.price_desc}">价格从高到低</option>
                <option value="newest" th:selected="${sort=='newest'}" th:text="#{sort.newest}">最新</option>
            </select>
        </div>
    </div>

    <div class="filters" th:if="${showCategoryFilter}">
        <a class="filter" th:classappend="${activeCat == null and activeCatCode == null} ? ' active'"
           th:href="@{|${langPrefix}/products|}" th:text="#{nav.products}">全部</a>
        <a class="filter" th:each="c : ${storeCategories}"
           th:classappend="${(activeCat != null and activeCat.name() == c.code) or (activeCatCode != null and activeCatCode == c.code)} ? ' active' : ''"
           th:href="@{__${langPrefix}__/products(cat=${c.code})}"
           th:text="${#locale.language == 'en' and !#strings.isEmpty(c.nameEn) ? c.nameEn : c.nameZh}">分类</a>
    </div>

    <p class="result-count" th:text="${totalItems} + ' ' + #{nav.products}">0 商品</p>

    <div class="grid">
        <div class="card reveal" th:each="p : ${products}">
            <a th:href="@{|${langPrefix}/product/${p.id}|}">
                <picture>
                    <source th:if="${!#strings.isEmpty(p.imageSrcset)}" type="image/webp"
                            th:srcset="${p.imageSrcset}" sizes="(max-width:600px) 50vw, 300px"/>
                    <img th:src="${p.imageUrl}" th:alt="${#locale.language == 'en' ? p.nameEn : p.name}"
                         loading="lazy" onerror="imgFallback(this)"/>
                </picture>
            </a>
            <div class="card-body">
                <h3 th:text="${#locale.language == 'en' ? p.nameEn : p.name}">商品名</h3>
                <span class="tag" th:text="${p.category.label}">分类</span>
                <span class="tag sold" th:if="${(sold[p.id] ?: 0) > 0}"
                      th:text="#{products.soldCount(${sold[p.id] ?: 0})}">已售 0 件</span>
                <span class="tag custom" th:if="${p.customizable}" th:text="#{home.customizable}">支持来图定制</span>
                <span class="tag low" th:if="${p.stock != null and p.stock > 0 and p.stock <= 10}" th:text="#{products.lowStock(${p.stock})}">仅剩 N 件</span>
                <div class="price" th:text="${currencySymbol} + ${#numbers.formatDecimal(p.price.multiply(fxRate),1,2)}">$0.00</div>
                <div class="card-actions">
                    <a class="btn btn-ghost btn-sm" th:href="@{|${langPrefix}/product/${p.id}|}" th:text="#{product.viewDetail}">查看详情</a>
                    <button class="btn btn-sm btn-add" type="button"
                            th:attr="title=#{cart.add}"
                            th:classappend="${p.stock != null and p.stock <= 0} ? 'btn-disabled' : ''"
                            th:onclick="${p.stock != null and p.stock <= 0} ? '' : 'addToCart(' + ${p.id} + ', 1)'"
                            th:text="${p.stock != null and p.stock <= 0} ? '缺货' : '🛒 加入'">🛒 加入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 搜索/筛选无结果 -->
    <div class="empty-state" th:if="${#lists.isEmpty(products)}">
        <div class="empty-icon">🔍</div>
        <p class="strong" th:text="#{search.empty}">没有找到相关商品</p>
        <p class="muted" th:text="#{search.emptyHint}">换个关键词，或浏览全部商品</p>
        <a class="btn btn-ghost" th:href="@{/products}" th:text="#{nav.products}">全部商品</a>
    </div>

    <!-- 分页 -->
    <div class="pager" th:if="${totalPages > 1}">
        <a class="pager-btn" th:if="${page > 0}"
           th:href="@{__${langPrefix}__/products(cat=${activeCatCode != null ? activeCatCode : activeCat}, q=${q}, sort=${sort}, page=${page-1}, priceMin=${pmin}, priceMax=${pmax})}" th:text="#{pagination.prev}">上一页</a>
        <span class="pager-info" th:text="(${page+1}) + ' / ' + ${totalPages}">1 / 1</span>
        <a class="pager-btn" th:if="${page < totalPages-1}"
           th:href="@{__${langPrefix}__/products(cat=${activeCatCode != null ? activeCatCode : activeCat}, q=${q}, sort=${sort}, page=${page+1}, priceMin=${pmin}, priceMax=${pmax})}" th:text="#{pagination.next}">下一页</a>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
