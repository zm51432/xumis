# APK 下载（https://shine.xumois.cn/download/）
# 由 deploy/apk/publish-apk.sh 自动写入 /etc/nginx/download-location.conf 并挂到站点。

# .apk 文件：指定 Android 安装包 MIME，浏览器才会正确识别
location ~* ^/download/.+\.apk$ {
    root /var/www;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="shine-xumis.apk"';
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# 下载页
location /download/ {
    alias /var/www/download/;
    index index.html;
    add_header Cache-Control "no-cache";
}
