<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="color-scheme" content="light"/>
    <meta name="format-detection" content="telephone=no"/>
    <title th:text="${storeName} + ' · ' + #{account.resetPwd}">重置密码</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20261030b')}"/>
    <meta name="theme-color" content="#7fc5ac"/>
    <meta name="robots" content="noindex,nofollow"/>
    <meta name="_csrf" th:content="${csrf}"/>
</head>
<body>

<div th:replace="~{fragments :: nav}"></div>

<div class="container section">
    <div class="form-wrap" style="max-width:420px;">
        <h2 class="section-title" th:text="#{account.resetPwd}">重置密码</h2>
        <p class="sub" th:text="#{account.resetPwdDesc}">请设置一个新的登录密码</p>

        <div class="alert-error" th:if="${invalid != null}" th:text="#{account.resetInvalid}">
            链接已失效或不正确，请重新申请密码重置。
        </div>
        <div class="alert-error" th:if="${error == 'weak'}" th:text="#{account.weakPassword}">密码至少 8 位</div>
        <div class="alert-error" th:if="${error == 'mismatch'}" th:text="#{account.pwdMismatch2}">两次输入的密码不一致</div>

        <form method="post" th:action="@{/reset-password}" th:if="${invalid == null}">
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="field">
                <label th:text="#{admin.newPassword}">新密码</label>
                <input type="password" name="password" required minlength="8" autocomplete="new-password"/>
            </div>
            <div class="field">
                <label th:text="#{account.confirmPassword}">确认新密码</label>
                <input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"/>
            </div>
            <button class="btn btn-block" type="submit" th:text="#{account.resetPwd}">重置密码</button>
        </form>

        <p class="muted small" style="text-align:center;margin-top:16px;" th:if="${invalid != null}">
            <a th:href="@{/forgot-password}" th:text="#{account.forgotPwd}">重新申请重置</a>
        </p>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/store.js}"></script>
</body>
</html>
